name: Sign SideStore Qusai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign SideStorequsai.ipa
    runs-on: macos-14
    timeout-minutes: 30

    env:
      TEAM_ID: "6JKQ4V5NDG"

      EXPECTED_MAIN_BUNDLE_ID: "com.SideStore.SideStore.6JKQ4V5NDG"
      EXPECTED_WIDGET_BUNDLE_ID: "com.SideStore.SideStore.6JKQ4V5NDG.AltWidget"

      ORIGINAL_MAIN_BUNDLE_ID: "com.SideStore.SideStore"
      ORIGINAL_WIDGET_BUNDLE_ID: "com.SideStore.SideStore.AltWidget"

      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

      MAIN_PROFILE_BASE64: ${{ secrets.MAIN_PROFILE_BASE64 }}
      ALTWIDGET_PROFILE_BASE64: ${{ secrets.ALTWIDGET_PROFILE_BASE64 }}

      NORMALIZED_P12_PASSWORD: "Qusai-GHA-Temporary-P12-2026"

    steps:

      # ============================================================
      # 1. Environment
      # ============================================================

      - name: Check macOS signing environment
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          xcodebuild -version

          echo "codesign:"
          xcrun --find codesign

          echo "security:"
          which security

          echo "Homebrew:"
          brew --version | head -1

      # ============================================================
      # 2. Download official SideStore 0.7.0-alpha
      # ============================================================

      - name: Download official SideStore 0.7.0-alpha
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            -o SideStore.ipa \
            "https://github.com/SideStore/SideStore/releases/download/0.7.0-alpha/SideStore.ipa"

          test -s SideStore.ipa

          echo "Downloaded SideStore:"
          ls -lh SideStore.ipa

          unzip -t SideStore.ipa >/dev/null

          echo "IPA archive: OK"

      # ============================================================
      # 3. Decode GitHub Secrets
      # ============================================================

      - name: Decode certificate and provisioning profiles
        shell: bash
        run: |
          set -euo pipefail

          rm -rf signing
          mkdir -p signing

          python3 <<'PY'
          import os
          import base64

          files = {
              "signing/original.p12": "P12_BASE64",
              "signing/main.mobileprovision": "MAIN_PROFILE_BASE64",
              "signing/widget.mobileprovision": "ALTWIDGET_PROFILE_BASE64",
          }

          for output, secret in files.items():
              value = os.environ.get(secret, "").strip()

              if not value:
                  raise SystemExit(
                      f"ERROR: GitHub Secret {secret} is empty"
                  )

              try:
                  data = base64.b64decode(value, validate=True)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: {secret} is not valid Base64: {exc}"
                  )

              if not data:
                  raise SystemExit(
                      f"ERROR: decoded {secret} is empty"
                  )

              with open(output, "wb") as f:
                  f.write(data)

              print(f"{output}: {len(data)} bytes")
          PY

      # ============================================================
      # 4. FIX THE ORIGINAL P12
      #
      # Your old P12 contains a key + certificate but has no MAC.
      # We extract it with -nomacver and rebuild an Apple-compatible P12.
      # ============================================================

      - name: Normalize old P12 safely
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if ! brew list openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi

          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"

          echo "Using:"
          "$OPENSSL_BIN" version

          SOURCE_PASS="${P12_PASSWORD:-}"

          if [ "$SOURCE_PASS" = "none" ]; then
            SOURCE_PASS=""
          fi

          rm -f \
            signing/p12-all.pem \
            signing/private-key.pem \
            signing/certificate.pem \
            signing/certificate.der \
            signing/normalized.p12

          echo "Extracting original P12 without MAC verification..."

          set +e

          "$OPENSSL_BIN" pkcs12 \
            -in signing/original.p12 \
            -nodes \
            -nomacver \
            -passin "pass:${SOURCE_PASS}" \
            -out signing/p12-all.pem

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "Normal extraction failed; retrying with legacy provider..."

            "$OPENSSL_BIN" pkcs12 \
              -legacy \
              -in signing/original.p12 \
              -nodes \
              -nomacver \
              -passin "pass:${SOURCE_PASS}" \
              -out signing/p12-all.pem
          fi

          test -s signing/p12-all.pem

          echo "Extracting private key..."

          "$OPENSSL_BIN" pkey \
            -in signing/p12-all.pem \
            -out signing/private-key.pem

          test -s signing/private-key.pem

          echo "Extracting certificate..."

          "$OPENSSL_BIN" x509 \
            -in signing/p12-all.pem \
            -out signing/certificate.pem

          test -s signing/certificate.pem

          "$OPENSSL_BIN" x509 \
            -in signing/certificate.pem \
            -outform DER \
            -out signing/certificate.der

          echo "Rebuilding Apple-compatible legacy temporary P12..."

          "$OPENSSL_BIN" pkcs12 \
            -export \
            -legacy \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -inkey signing/private-key.pem \
            -in signing/certificate.pem \
            -name "Qusai SideStore Signing" \
            -passout env:NORMALIZED_P12_PASSWORD \
            -out signing/normalized.p12

          test -s signing/normalized.p12

          echo ""
          echo "Certificate:"
          "$OPENSSL_BIN" x509 \
            -in signing/certificate.pem \
            -noout \
            -subject \
            -issuer \
            -serial \
            -dates

          echo ""
          echo "Normalized P12 check:"

          # Verify the MAC with the same password used for Keychain import.
          # Do not use -nomacver for the rebuilt archive.
          "$OPENSSL_BIN" pkcs12 \
            -legacy \
            -in signing/normalized.p12 \
            -passin env:NORMALIZED_P12_PASSWORD \
            -info \
            -noout

          # Round-trip both objects without printing any private material.
          trap 'rm -f signing/normalized-check.pem signing/normalized-key-check.pem signing/normalized-certificate-check.der' EXIT

          "$OPENSSL_BIN" pkcs12 \
            -legacy \
            -in signing/normalized.p12 \
            -passin env:NORMALIZED_P12_PASSWORD \
            -nodes \
            -out signing/normalized-check.pem

          "$OPENSSL_BIN" pkey \
            -in signing/normalized-check.pem \
            -check \
            -noout

          "$OPENSSL_BIN" pkey \
            -in signing/normalized-check.pem \
            -out signing/normalized-key-check.pem

          "$OPENSSL_BIN" x509 \
            -in signing/normalized-check.pem \
            -outform DER \
            -out signing/normalized-certificate-check.der

          if ! cmp -s signing/private-key.pem signing/normalized-key-check.pem; then
            echo "ERROR: Normalized P12 private key differs from the original"
            exit 1
          fi

          if ! cmp -s signing/certificate.der signing/normalized-certificate-check.der; then
            echo "ERROR: Normalized P12 certificate differs from the original"
            exit 1
          fi

          echo "Normalized P12 MAC, private key and certificate: OK"
          echo "Original private key and certificate preserved: YES"
          echo "P12 normalization: OK"

      # ============================================================
      # 5. Decode provisioning profiles
      # ============================================================

      - name: Decode provisioning profiles
        shell: bash
        run: |
          set -euo pipefail

          security cms \
            -D \
            -i signing/main.mobileprovision \
            > signing/main-profile.plist

          security cms \
            -D \
            -i signing/widget.mobileprovision \
            > signing/widget-profile.plist

          test -s signing/main-profile.plist
          test -s signing/widget-profile.plist

          echo "Provisioning profiles decoded"

      # ============================================================
      # 6. Validate EVERYTHING before signing
      #
      # - correct team
      # - correct bundle IDs
      # - not expired
      # - both profiles cover the same iPhone
      # - P12 certificate is allowed by BOTH profiles
      # ============================================================

      - name: Validate certificate and profiles
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import plistlib
          import hashlib
          import datetime

          TEAM = os.environ["TEAM_ID"]

          EXPECTED_MAIN = os.environ[
              "EXPECTED_MAIN_BUNDLE_ID"
          ]

          EXPECTED_WIDGET = os.environ[
              "EXPECTED_WIDGET_BUNDLE_ID"
          ]

          with open(
              "signing/certificate.der",
              "rb"
          ) as f:
              p12_certificate = f.read()

          p12_hash = hashlib.sha256(
              p12_certificate
          ).hexdigest()

          print("P12 certificate SHA256:")
          print(p12_hash)

          def normalize_date(value):
              if value is None:
                  return None

              if value.tzinfo is None:
                  return value.replace(
                      tzinfo=datetime.timezone.utc
                  )

              return value.astimezone(
                  datetime.timezone.utc
              )

          def inspect(path, expected_bundle, label):

              with open(path, "rb") as f:
                  profile = plistlib.load(f)

              entitlements = profile.get(
                  "Entitlements",
                  {}
              )

              app_identifier = entitlements.get(
                  "application-identifier",
                  ""
              )

              if "." not in app_identifier:
                  raise SystemExit(
                      f"ERROR: {label}: invalid application-identifier"
                  )

              profile_team, bundle = (
                  app_identifier.split(".", 1)
              )

              teams = profile.get(
                  "TeamIdentifier",
                  []
              )

              devices = profile.get(
                  "ProvisionedDevices",
                  []
              )

              expiration = normalize_date(
                  profile.get("ExpirationDate")
              )

              developer_certificates = profile.get(
                  "DeveloperCertificates",
                  []
              )

              certificate_hashes = [
                  hashlib.sha256(c).hexdigest()
                  for c in developer_certificates
              ]

              groups = entitlements.get(
                  "com.apple.security.application-groups",
                  []
              )

              print("")
              print("=" * 60)
              print(label)
              print("=" * 60)
              print("Name:", profile.get("Name"))
              print("UUID:", profile.get("UUID"))
              print("Team:", profile_team)
              print("Bundle ID:", bundle)
              print("Expiration:", expiration)
              print("Provisioned devices:", devices)
              print("App Groups:", groups)
              print(
                  "Certificates in profile:",
                  certificate_hashes
              )

              if profile_team != TEAM:
                  raise SystemExit(
                      f"ERROR: {label}: Team ID mismatch"
                  )

              if TEAM not in teams:
                  raise SystemExit(
                      f"ERROR: {label}: TeamIdentifier mismatch"
                  )

              if bundle != expected_bundle:
                  raise SystemExit(
                      f"ERROR: {label}: bundle is '{bundle}', "
                      f"expected '{expected_bundle}'"
                  )

              if expiration is None:
                  raise SystemExit(
                      f"ERROR: {label}: no expiration date"
                  )

              now = datetime.datetime.now(
                  datetime.timezone.utc
              )

              if expiration <= now:
                  raise SystemExit(
                      f"ERROR: {label}: profile expired"
                  )

              if not devices:
                  raise SystemExit(
                      f"ERROR: {label}: no provisioned iPhone"
                  )

              if p12_hash not in certificate_hashes:
                  raise SystemExit(
                      f"ERROR: {label}: this profile does NOT "
                      "allow your old P12 certificate."
                  )

              print(
                  "P12 certificate matches profile: YES"
              )

              return {
                  "profile": profile,
                  "entitlements": entitlements,
                  "bundle": bundle,
                  "groups": groups,
                  "devices": set(devices),
              }

          main = inspect(
              "signing/main-profile.plist",
              EXPECTED_MAIN,
              "MAIN SIDESTORE PROFILE",
          )

          widget = inspect(
              "signing/widget-profile.plist",
              EXPECTED_WIDGET,
              "ALTWIDGET PROFILE",
          )

          common_devices = (
              main["devices"] &
              widget["devices"]
          )

          if not common_devices:
              raise SystemExit(
                  "ERROR: Main and AltWidget profiles do not "
                  "cover the same iPhone."
              )

          print("")
          print("Common provisioned iPhone:")
          for device in sorted(common_devices):
              print(device)

          main_groups = main["groups"]
          widget_groups = widget["groups"]

          if (
              main_groups and
              not set(main_groups).intersection(widget_groups)
          ):
              print("")
              print(
                  "::warning::AltWidget profile does not "
                  "contain the same App Group as SideStore."
              )
              print(
                  "::warning::The app can still be signed, "
                  "but the widget may not share SideStore data."
              )

          with open(
              "signing/main-entitlements.plist",
              "wb"
          ) as f:
              plistlib.dump(
                  main["entitlements"],
                  f,
                  fmt=plistlib.FMT_XML
              )

          with open(
              "signing/widget-entitlements.plist",
              "wb"
          ) as f:
              plistlib.dump(
                  widget["entitlements"],
                  f,
                  fmt=plistlib.FMT_XML
              )

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as env:

              env.write(
                  f"MAIN_BUNDLE_ID={main['bundle']}\n"
              )

              env.write(
                  f"WIDGET_BUNDLE_ID={widget['bundle']}\n"
              )

              env.write(
                  "MAIN_GROUPS_JSON="
                  + json.dumps(
                      main_groups,
                      separators=(",", ":")
                  )
                  + "\n"
              )

              env.write(
                  "WIDGET_GROUPS_JSON="
                  + json.dumps(
                      widget_groups,
                      separators=(",", ":")
                  )
                  + "\n"
              )

          print("")
          print(
              "ALL PROFILE / CERTIFICATE CHECKS PASSED"
          )
          PY

      # ============================================================
      # 7. Import CLEAN normalized P12 into temporary Keychain
      # ============================================================

      - name: Import signing identity into temporary Keychain
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/qusai.keychain-db"
          KEYCHAIN_PASSWORD="Qusai-Keychain-2026"

          rm -f "$KEYCHAIN_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            signing/normalized.p12 \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -P "$NORMALIZED_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Available valid signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            > signing/codesigning-identities.txt

          cat signing/codesigning-identities.txt

          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"

          EXPECTED_IDENTITY="$(
            "$OPENSSL_BIN" x509 \
              -in signing/certificate.pem \
              -noout \
              -fingerprint \
              -sha1 \
              | cut -d= -f2 \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"

          IDENTITY="$(
            awk -v expected="$EXPECTED_IDENTITY" \
              '$2 == expected {print $2}' \
              signing/codesigning-identities.txt
          )"

          if [ -z "$IDENTITY" ] || [ "$IDENTITY" != "$EXPECTED_IDENTITY" ]; then
            echo "ERROR: Original P12 certificate is not a valid Keychain signing identity"
            exit 1
          fi

          echo "Original certificate imported as a valid signing identity: YES"

          echo "SIGNING_IDENTITY=$IDENTITY" \
            >> "$GITHUB_ENV"

          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" \
            >> "$GITHUB_ENV"

          echo "Using identity:"
          echo "$IDENTITY"

      # ============================================================
      # 8. Extract IPA
      # ============================================================

      - name: Extract SideStore IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir work

          unzip -q SideStore.ipa -d work

          APP_PATH="$(
            find work/Payload \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              | head -1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          WIDGET_PATH="$APP_PATH/PlugIns/AltWidgetExtension.appex"

          if [ ! -d "$WIDGET_PATH" ]; then
            echo "ERROR: AltWidgetExtension.appex not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

          echo "WIDGET_PATH=$WIDGET_PATH" \
            >> "$GITHUB_ENV"

          echo "SideStore app:"
          echo "$APP_PATH"

          echo "AltWidget:"
          echo "$WIDGET_PATH"

      # ============================================================
      # 9. Verify exact official build
      # ============================================================

      - name: Verify SideStore build
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Info.plist"
          )"

          MAIN_ORIGINAL="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )"

          WIDGET_ORIGINAL="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$WIDGET_PATH/Info.plist"
          )"

          echo "Version: $VERSION"
          echo "Main original: $MAIN_ORIGINAL"
          echo "Widget original: $WIDGET_ORIGINAL"

          if [ "$VERSION" != "0.7.0-20260911.328+6032424a" ]; then
            echo "ERROR: Wrong SideStore release"
            exit 1
          fi

          if [ "$MAIN_ORIGINAL" != "$ORIGINAL_MAIN_BUNDLE_ID" ]; then
            echo "ERROR: Unexpected original SideStore Bundle ID"
            exit 1
          fi

          if [ "$WIDGET_ORIGINAL" != "$ORIGINAL_WIDGET_BUNDLE_ID" ]; then
            echo "ERROR: Unexpected AltWidget Bundle ID"
            exit 1
          fi

          echo "Correct SideStore 0.7.0-alpha confirmed"

      # ============================================================
      # 10. Rewrite identifiers and SideStore metadata
      # ============================================================

      - name: Rewrite SideStore identifiers
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import plistlib

          app = os.environ["APP_PATH"]
          widget = os.environ["WIDGET_PATH"]

          main_id = os.environ["MAIN_BUNDLE_ID"]
          widget_id = os.environ["WIDGET_BUNDLE_ID"]

          original_main = os.environ[
              "ORIGINAL_MAIN_BUNDLE_ID"
          ]

          original_widget = os.environ[
              "ORIGINAL_WIDGET_BUNDLE_ID"
          ]

          main_groups = json.loads(
              os.environ["MAIN_GROUPS_JSON"]
          )

          widget_groups = json.loads(
              os.environ["WIDGET_GROUPS_JSON"]
          )

          def read_plist(path):
              with open(path, "rb") as f:
                  return plistlib.load(f)

          def write_plist(path, data):
              with open(path, "wb") as f:
                  plistlib.dump(
                      data,
                      f,
                      fmt=plistlib.FMT_XML,
                      sort_keys=False
                  )

          # --------------------------------------
          # MAIN APP
          # --------------------------------------

          main_info_path = os.path.join(
              app,
              "Info.plist"
          )

          main = read_plist(main_info_path)

          main["CFBundleIdentifier"] = main_id

          # Keep original identifiers available
          # to AltStore / SideStore-family tooling.
          main["ALTBundleID"] = original_main
          main["ALTBundleIdentifier"] = original_main

          # Groups from the REAL provisioning profile.
          main["ALTAppGroups"] = main_groups

          main.pop("DTXcode", None)
          main.pop("DTXcodeBuild", None)

          # Rewrite SideStore backup URL scheme exactly
          # for the final Bundle ID.
          url_types = main.get(
              "CFBundleURLTypes",
              []
          )

          cleaned = []

          for item in url_types:
              schemes = item.get(
                  "CFBundleURLSchemes",
                  []
              )

              if any(
                  scheme.startswith("sidestore-")
                  for scheme in schemes
              ):
                  continue

              cleaned.append(item)

          cleaned.append({
              "CFBundleTypeRole": "Editor",
              "CFBundleURLName": main_id,
              "CFBundleURLSchemes": [
                  f"sidestore-{main_id}"
              ],
          })

          main["CFBundleURLTypes"] = cleaned

          # Rewrite background identifiers too,
          # if this build ever contains them.
          if "BGTaskSchedulerPermittedIdentifiers" in main:
              updated = []

              for task in main[
                  "BGTaskSchedulerPermittedIdentifiers"
              ]:
                  if (
                      task == original_main or
                      task.startswith(
                          original_main + "."
                      )
                  ):
                      task = (
                          main_id +
                          task[len(original_main):]
                      )

                  if task not in updated:
                      updated.append(task)

              main[
                  "BGTaskSchedulerPermittedIdentifiers"
              ] = updated

          write_plist(
              main_info_path,
              main
          )

          # --------------------------------------
          # WIDGET
          # --------------------------------------

          widget_info_path = os.path.join(
              widget,
              "Info.plist"
          )

          w = read_plist(
              widget_info_path
          )

          w["CFBundleIdentifier"] = widget_id

          w["ALTBundleID"] = original_widget
          w["ALTBundleIdentifier"] = original_widget

          # Important:
          # Use the groups actually permitted by
          # the WIDGET profile, not blindly the
          # main profile's groups.
          w["ALTAppGroups"] = widget_groups

          w.pop("DTXcode", None)
          w.pop("DTXcodeBuild", None)

          write_plist(
              widget_info_path,
              w
          )

          print("Main Bundle ID:")
          print(main_id)

          print("Main ALTAppGroups:")
          print(main_groups)

          print("Widget Bundle ID:")
          print(widget_id)

          print("Widget ALTAppGroups:")
          print(widget_groups)
          PY

      # ============================================================
      # 11. Embed correct provisioning profiles
      # ============================================================

      - name: Embed provisioning profiles
        shell: bash
        run: |
          set -euo pipefail

          cp \
            signing/main.mobileprovision \
            "$APP_PATH/embedded.mobileprovision"

          cp \
            signing/widget.mobileprovision \
            "$WIDGET_PATH/embedded.mobileprovision"

          find "$APP_PATH" \
            -type d \
            -name "_CodeSignature" \
            -prune \
            -exec rm -rf {} +

          echo "Profiles embedded"
          echo "Old signatures removed"

      # ============================================================
      # 12. Sign nested libraries/frameworks FIRST
      # ============================================================

      - name: Sign nested code
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$APP_PATH/Frameworks" ]; then

            while IFS= read -r -d '' file; do

              echo "Signing dylib:"
              echo "$file"

              codesign \
                --force \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$SIGNING_KEYCHAIN" \
                --timestamp=none \
                "$file"

            done < <(
              find "$APP_PATH/Frameworks" \
                -type f \
                -name '*.dylib' \
                -print0
            )

            while IFS= read -r -d '' framework; do

              echo "Signing framework:"
              echo "$framework"

              codesign \
                --force \
                --sign "$SIGNING_IDENTITY" \
                --keychain "$SIGNING_KEYCHAIN" \
                --timestamp=none \
                "$framework"

            done < <(
              find "$APP_PATH/Frameworks" \
                -type d \
                -name '*.framework' \
                -print0
            )

          fi

      # ============================================================
      # 13. Sign AltWidget with ITS OWN profile entitlements
      # ============================================================

      - name: Sign AltWidgetExtension
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" \
            --entitlements signing/widget-entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$WIDGET_PATH"

          codesign \
            --verify \
            --strict \
            --verbose=4 \
            "$WIDGET_PATH"

          echo "AltWidget signature: OK"

      # ============================================================
      # 14. Sign MAIN APP LAST
      # ============================================================

      - name: Sign SideStore main app
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" \
            --entitlements signing/main-entitlements.plist \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP_PATH"

          echo "Main SideStore signed"

      # ============================================================
      # 15. Full signature verification
      # ============================================================

      - name: Verify all signatures
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "===== MAIN APP ====="

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "$APP_PATH"

          codesign \
            -d \
            --verbose=4 \
            "$APP_PATH" \
            2>&1

          echo ""
          echo "===== MAIN ENTITLEMENTS ====="

          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/dev/null

          echo ""
          echo "===== WIDGET ====="

          codesign \
            --verify \
            --strict \
            --verbose=4 \
            "$WIDGET_PATH"

          codesign \
            -d \
            --verbose=4 \
            "$WIDGET_PATH" \
            2>&1

          echo ""
          echo "===== WIDGET ENTITLEMENTS ====="

          codesign \
            -d \
            --entitlements :- \
            "$WIDGET_PATH" \
            2>/dev/null

          echo ""
          echo "ALL CODESIGN CHECKS PASSED"

      # ============================================================
      # 16. Final sanity check
      # ============================================================

      - name: Verify final bundle identifiers and profiles
        shell: bash
        run: |
          set -euo pipefail

          FINAL_MAIN="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )"

          FINAL_WIDGET="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$WIDGET_PATH/Info.plist"
          )"

          echo "Final main Bundle ID:"
          echo "$FINAL_MAIN"

          echo "Final widget Bundle ID:"
          echo "$FINAL_WIDGET"

          if [ "$FINAL_MAIN" != "$EXPECTED_MAIN_BUNDLE_ID" ]; then
            echo "ERROR: Main Bundle ID changed unexpectedly"
            exit 1
          fi

          if [ "$FINAL_WIDGET" != "$EXPECTED_WIDGET_BUNDLE_ID" ]; then
            echo "ERROR: Widget Bundle ID changed unexpectedly"
            exit 1
          fi

          test -s "$APP_PATH/embedded.mobileprovision"
          test -s "$WIDGET_PATH/embedded.mobileprovision"

          echo "Final bundle/profile checks: OK"

      # ============================================================
      # 17. Package final IPA
      # ============================================================

      - name: Create SideStorequsai.ipa
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            SideStorequsai.ipa \
            SideStorequsai.sha256

          cd work

          /usr/bin/zip \
            -qry \
            ../SideStorequsai.ipa \
            Payload \
            -x '*.DS_Store' \
            -x '*/._*' \
            -x '__MACOSX/*'

          cd ..

          test -s SideStorequsai.ipa

          unzip \
            -t SideStorequsai.ipa \
            >/dev/null

          echo "Final IPA:"
          ls -lh SideStorequsai.ipa

          echo "ZIP integrity: OK"

      # ============================================================
      # 18. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          shasum \
            -a 256 \
            SideStorequsai.ipa \
            | tee SideStorequsai.sha256

      # ============================================================
      # 19. Upload result
      # ============================================================

      - name: Upload SideStorequsai
        uses: actions/upload-artifact@v4
        with:
          name: SideStorequsai
          path: |
            SideStorequsai.ipa
            SideStorequsai.sha256
          if-no-files-found: error
          retention-days: 3