name: macOS GUI - 1 Hour

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official iLoader
        run: |
          curl -L \
            -o ~/Downloads/iloader.dmg \
            https://github.com/nab138/iloader/releases/download/v2.3.6/iloader-darwin-universal.dmg

      - name: Install iLoader
        run: |
          hdiutil attach ~/Downloads/iloader.dmg -nobrowse
          APP="$(find /Volumes -maxdepth 2 -name 'iloader.app' -print -quit)"
          echo "Found: $APP"
          cp -R "$APP" /Applications/
          cp -R "$APP" ~/Desktop/
          hdiutil detach "$(dirname "$APP")" || true

      - name: Install RustDesk
        run: |
          brew install --cask rustdesk

      - name: Launch apps
        run: |
          open -a RustDesk
          open -a iLoader
          sleep 10

      - name: Show RustDesk info
        run: |
          echo "Trying to read RustDesk ID..."
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id || true
          echo "RustDesk app launched."

      - name: Keep session alive
        run: |
          echo "macOS session will remain alive for about 55 minutes."
          for i in {1..55}; do
            echo "Minute $i / 55"
            sleep 60
          done
